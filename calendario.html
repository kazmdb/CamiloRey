<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva tu Turno - Camilo Rey</title>
    <style>
        @font-face {
            font-family: 'Montserrat';
            src: url('assets/fonts/Montserrat-VariableFont_wght.ttf') format('truetype');
            font-weight: 100 900;
        }

        @font-face {
            font-family: 'Oswald';
            src: url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap');
        }

        /* Dark Theme CSS Variables */
        :root {
            --gold: #c8853a;
            --gold-light: #d4934a;
            --dark: #111111;
            --dark-mid: #1a1a1a;
            --dark-light: #222222;
            --white: #ffffff;
            --white-dim: rgba(255,255,255,0.75);
            --white-faint: rgba(255,255,255,0.15);
            --bg-color: var(--dark);
            --surface-color: var(--dark-mid);
            --text-primary: var(--white);
            --text-secondary: var(--white-dim);
            --accent-gold: var(--gold);
            --accent-gold-hover: var(--gold-light);
            --danger-red: #FF3B30;
            --success-green: #34C759;
            --warning-orange: #FF9500;
            --border-color: var(--white-faint);
            --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --border-radius-lg: 18px;
            --border-radius-md: 12px;
            --border-radius-sm: 8px;
            --transition-speed: 0.25s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-primary);
            background-color: var(--bg-color);
            line-height: 1.5;
            font-weight: 400;
        }

        /* Header */
        header {
            background: rgba(0,0,0,0.9);
            padding: 14px 24px;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .header-logo img {
            width: 42px;
            height: 42px;
            object-fit: cover;
            border-radius: 50%;
        }

        .header-logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .header-logo-main {
            font-family: 'Oswald', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--white);
            letter-spacing: 3px;
        }

        .header-logo-sub {
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            color: var(--accent-gold);
            letter-spacing: 4px;
            font-weight: 600;
        }

        .back-btn {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            transition: all var(--transition-speed);
        }

        .back-btn:hover {
            color: var(--accent-gold);
        }

        /* Main Content */
        .turnos-container {
            max-width: 1000px;
            margin: 80px auto 40px;
            padding: 0 20px 100px 20px;
        }

        .turnos-header {
            text-align: center;
            margin-bottom: 48px;
        }

        .turnos-header h1 {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .turnos-header p {
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Progress Steps */
        .progress-steps {
            display: flex;
            justify-content: center;
            margin-bottom: 48px;
            gap: 32px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.3;
            transition: opacity 0.2s;
        }

        .step.active {
            opacity: 1;
        }

        .step.completed {
            opacity: 0.6;
        }

        .step-number {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--accent-gold);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            font-size: 13px;
        }

        .step.active .step-number {
            background: var(--accent-gold);
        }

        .step.completed .step-number {
            background: var(--accent-gold);
        }

        .step-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
        }

        /* Category Selection */
        .category-selection {
            background: var(--surface-color);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 32px;
        }

        .category-selection h2 {
            font-size: 20px;
            margin-bottom: 24px;
            color: var(--text-primary);
            text-align: center;
            font-weight: 600;
        }

        .category-grid {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .category-card {
            border: none;
            border-bottom: 1px solid var(--border-color);
            border-radius: 0;
            padding: 30px 0;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--surface-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-card:last-child {
            border-bottom: none;
        }

        .category-card:hover {
            background: var(--dark-light);
        }

        .category-card.selected {
            background: var(--dark-light);
        }

        .category-content {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .category-icon {
            font-size: 40px;
        }

        .category-name {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .category-description {
            font-size: 15px;
            color: var(--text-secondary);
        }

        /* Service Selection */
        .service-selection {
            background: var(--surface-color);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 32px;
            display: none;
        }

        .service-selection h2 {
            font-size: 28px;
            margin-bottom: 24px;
            color: var(--text-primary);
            font-weight: 700;
        }

        /* Service Navigation */
        .service-nav {
            position: sticky;
            top: 50px;
            z-index: 100;
            background: var(--surface-color);
            padding: 16px 0;
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border-color);
        }

        .service-nav-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .service-nav-arrow {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .service-nav-arrow:hover {
            background: #f5f5f5;
            border-color: var(--text-primary);
        }

        .service-nav-arrow:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .service-nav-menu {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
            flex: 1;
        }

        .service-nav-menu::-webkit-scrollbar {
            display: none;
        }

        .service-nav-item {
            padding: 10px 20px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            text-decoration: none;
        }

        .service-nav-item:hover {
            background: #f5f5f5;
        }

        .service-nav-item.active {
            background: var(--accent-gold);
            color: #fff;
        }

        /* Service Sections */
        .service-section {
            margin-bottom: 48px;
            scroll-margin-top: 110px;
        }

        .service-section h3 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        .service-grid {
            display: flex;
            flex-direction: column;
            gap: 0;
            margin-bottom: 24px;
        }

        .service-card {
            border: none;
            border-bottom: 1px solid var(--border-color);
            border-radius: 0;
            padding: 20px 0;
            cursor: pointer;
            transition: all 0.2s;
            background: var(--surface-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: auto;
        }

        .service-card:last-child {
            border-bottom: none;
        }

        .service-card:hover {
            background: var(--dark-light);
        }

        .service-card.selected {
            background: var(--dark-light);
        }

        .service-card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .service-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding-right: 20px;
        }

        .service-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .service-duration {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0;
        }

        .service-description {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0;
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .service-price {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-top: 4px;
        }

        .service-action {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .service-add-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 24px;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .service-add-btn:hover {
            background: #f5f5f5;
            border-color: var(--text-primary);
        }

        .service-card.selected .service-add-btn {
            background: var(--accent-gold);
            color: #fff;
            border-color: var(--text-primary);
        }

        .service-card.selected .service-add-btn:hover {
            background: var(--accent-gold-hover);
        }

        /* Service Cart */
        .service-cart {
            background: var(--surface-color);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 32px;
        }

        .service-cart h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: var(--text-primary);
            font-weight: 600;
        }

        .cart-items {
            margin-bottom: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            background: var(--dark-light);
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary);
            font-size: 15px;
        }

        .cart-item-details {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .cart-item-price {
            font-weight: 600;
            color: var(--text-primary);
            margin-right: 16px;
            font-size: 15px;
        }

        .cart-item-remove {
            background: var(--surface-color);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .cart-item-remove:hover {
            background: #f5f5f5;
            border-color: var(--text-primary);
        }

        .cart-summary {
            background: var(--dark-light);
            padding: 20px;
            border-radius: 6px;
            margin-top: 20px;
        }

        .cart-summary-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .cart-summary-row:last-child {
            border-bottom: none;
        }

        .cart-summary-row.total {
            font-weight: 600;
            font-size: 16px;
            color: var(--text-primary);
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--accent-gold);
        }

        .cart-empty {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .cart-empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        /* Fixed Action Bar */
        .fixed-action-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--surface-color);
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            z-index: 1000;
            display: none;
        }

        .fixed-action-bar.show {
            display: block;
        }

        .fixed-action-bar-content {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        .fixed-action-bar-info {
            flex: 1;
        }

        .fixed-action-bar-info h4 {
            font-size: 15px;
            margin-bottom: 4px;
            color: var(--text-primary);
            font-weight: 600;
        }

        .fixed-action-bar-info p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .fixed-action-bar-buttons {
            display: flex;
            gap: 12px;
        }

        .fixed-action-bar-buttons .btn {
            padding: 12px 24px;
            font-size: 14px;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 999px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-speed);
            flex: 1;
        }

        .btn-primary {
            background: var(--accent-gold);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-gold-hover);
            transform: scale(1.02);
        }

        .btn-primary:disabled {
            background: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: var(--bg-color);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: #E5E5EA;
            border-color: var(--text-secondary);
        }

        /* Days Grid */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .day-card {
            background: var(--surface-color);
            border-radius: var(--border-radius-md);
            padding: 20px;
            cursor: pointer;
            transition: all var(--transition-speed);
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
        }

        .day-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            border-color: var(--accent-gold);
        }

        .day-card.selected {
            border-color: var(--accent-gold);
            background: rgba(200, 133, 58, 0.1);
            box-shadow: 0 0 0 3px rgba(200, 133, 58, 0.2);
        }

        .day-card.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: var(--bg-color);
        }

        .day-card.full {
            opacity: 0.6;
            cursor: not-allowed;
            background: var(--bg-color);
        }

        .day-date {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }

        .day-name {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .day-availability {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .availability-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 500;
            margin-top: 4px;
        }

        .availability-high {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .availability-medium {
            background: #fff3e0;
            color: #ef6c00;
        }

        .availability-low {
            background: #ffebee;
            color: #c62828;
        }

        .availability-full {
            background: #f5f5f5;
            color: var(--text-secondary);
        }

        /* iOS-style Loading Spinner */
        .loading-spinner {
            display: none;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .loading-spinner.show {
            display: flex;
        }

        .spinner {
            position: relative;
            width: 40px;
            height: 40px;
        }

        .spinner-blade {
            position: absolute;
            left: 44.5%;
            top: 37%;
            width: 10%;
            height: 25%;
            border-radius: 50%/20%;
            animation: spinner-fade 1s linear infinite;
            background: #999;
        }

        .spinner-blade:nth-child(1) { transform: rotate(0deg) translate(0, -140%); animation-delay: -1s; }
        .spinner-blade:nth-child(2) { transform: rotate(30deg) translate(0, -140%); animation-delay: -0.9167s; }
        .spinner-blade:nth-child(3) { transform: rotate(60deg) translate(0, -140%); animation-delay: -0.8333s; }
        .spinner-blade:nth-child(4) { transform: rotate(90deg) translate(0, -140%); animation-delay: -0.75s; }
        .spinner-blade:nth-child(5) { transform: rotate(120deg) translate(0, -140%); animation-delay: -0.6667s; }
        .spinner-blade:nth-child(6) { transform: rotate(150deg) translate(0, -140%); animation-delay: -0.5833s; }
        .spinner-blade:nth-child(7) { transform: rotate(180deg) translate(0, -140%); animation-delay: -0.5s; }
        .spinner-blade:nth-child(8) { transform: rotate(210deg) translate(0, -140%); animation-delay: -0.4167s; }
        .spinner-blade:nth-child(9) { transform: rotate(240deg) translate(0, -140%); animation-delay: -0.3333s; }
        .spinner-blade:nth-child(10) { transform: rotate(270deg) translate(0, -140%); animation-delay: -0.25s; }
        .spinner-blade:nth-child(11) { transform: rotate(300deg) translate(0, -140%); animation-delay: -0.1667s; }
        .spinner-blade:nth-child(12) { transform: rotate(330deg) translate(0, -140%); animation-delay: -0.0833s; }

        @keyframes spinner-fade {
            0% { opacity: 1; }
            100% { opacity: 0.25; }
        }

        .loading-text {
            margin-left: 16px;
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Time Slots */
        .time-slots-container {
            background: var(--surface-color);
            border-radius: var(--border-radius-lg);
            padding: 24px;
            display: none;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border-color);
        }

        .time-slots-container.show {
            display: block;
        }

        .time-slots-header {
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .time-slots-header h2 {
            font-size: 20px;
            color: var(--text-primary);
            margin-bottom: 4px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }

        .time-slots-header p {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .time-slots-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
        }

        .time-slot {
            padding: 16px;
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            cursor: pointer;
            transition: all var(--transition-speed);
            background: var(--surface-color);
            text-align: center;
            box-shadow: var(--card-shadow);
        }

        .time-slot:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            border-color: var(--accent-gold);
        }

        .time-slot.selected {
            border-color: var(--accent-gold);
            background: var(--accent-gold);
            color: white;
            box-shadow: 0 0 0 3px rgba(200, 133, 58, 0.2);
        }

        .time-slot.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: var(--bg-color);
        }

        .time-slot-period {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary);
            letter-spacing: -0.2px;
        }

        .time-slot.selected .time-slot-period {
            color: white;
        }

        .time-slot-time {
            font-size: 14px;
            margin-bottom: 4px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .time-slot.selected .time-slot-time {
            color: white;
        }

        .time-slot-availability {
            font-size: 11px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .time-slot.selected .time-slot-availability {
            color: white;
        }

        .time-slot-availability.available {
            color: var(--success-green);
            font-weight: 600;
        }

        .time-slot-availability.occupied {
            color: var(--danger-red);
            font-weight: 600;
        }

        .time-slot-availability.warning {
            color: var(--warning-orange);
            font-weight: 600;

        // Calculate total turnos per day based on duration
        function getTotalTurnosPerDay() {
            const hours = businessHours[1]; // Use Monday as reference
            if (!hours) return 20;

            const [startHour, startMin] = hours.start.split(':').map(Number);
            const [endHour, endMin] = hours.end.split(':').map(Number);
            const totalMinutes = (endHour * 60 + endMin) - (startHour * 60 + startMin);
            const totalTurnos = Math.floor(totalMinutes / configTurnos.duracionTurno);

            return Math.max(1, totalTurnos);
        }

        // Generate individual time slots for a specific day
        function generateTimeSlotsForDay(dayOfWeek) {
            const hours = businessHours[dayOfWeek];
            console.log('generateTimeSlotsForDay - dayOfWeek:', dayOfWeek, 'hours:', hours);

            if (!hours) return [];

            const [startHour, startMin] = hours.start.split(':').map(Number);
            const [endHour, endMin] = hours.end.split(':').map(Number);

            const startMinutes = startHour * 60 + startMin;
            const endMinutes = endHour * 60 + endMin;
            const totalMinutes = endMinutes - startMinutes;
            const slotDuration = configTurnos.duracionTurno; // Use configured duration
            const totalTurnos = Math.floor(totalMinutes / slotDuration);

            const slots = [];
            for (let i = 0; i < totalTurnos; i++) {
                const slotStartMinutes = startMinutes + (i * slotDuration);
                const slotEndMinutes = slotStartMinutes + slotDuration;

                const slotStartHour = Math.floor(slotStartMinutes / 60);
                const slotStartMin = Math.round(slotStartMinutes % 60);
                const slotEndHour = Math.floor(slotEndMinutes / 60);
                const slotEndMin = Math.round(slotEndMinutes % 60);

                const startTime = `${String(slotStartHour).padStart(2, '0')}:${String(slotStartMin).padStart(2, '0')}`;
                const endTime = `${String(slotEndHour).padStart(2, '0')}:${String(slotEndMin).padStart(2, '0')}`;

                slots.push({
                    id: i,
                    name: `Turno ${i + 1}`,
                    time: startTime,
                    arrivalTime: startTime
                });
            }

        // Verificar si un servicio está disponible en una fecha y hora específicas
        function isServiceAvailableInTimeRange(serviceId, dateKey, timeSlot) {
            const config = configServicios[serviceId];
            if (!config || !config.timeRestriction || !config.timeRestriction.enabled) {
                return true; // Sin restricción de tiempo
            }

            const restriction = config.timeRestriction;
            if (!restriction.startTime || !restriction.endTime) {
                return true; // Restricción incompleta, permitir
            }

            // Verificar si el horario está dentro del rango
            const [slotHour, slotMin] = timeSlot.split(':').map(Number);
            const [startHour, startMin] = restriction.startTime.split(':').map(Number);
            const [endHour, endMin] = restriction.endTime.split(':').map(Number);

            const slotTime = slotHour * 60 + slotMin;
            const startTime = startHour * 60 + startMin;
            const endTime = endHour * 60 + endMin;

            // Verificar restricción según el tipo
            if (restriction.type === 'daily') {
                // Restricción diaria: aplicar a todos los días
                return slotTime >= startTime && slotTime <= endTime;
            } else if (restriction.type === 'specific') {
                // Restricción específica: verificar fecha
                if (!restriction.date) {
                    return true; // Sin fecha especificada, permitir
                }

                // Parsear la fecha de la restricción
                const [day, month, year] = restriction.date.split('/').map(Number);
                const restrictionDate = new Date(year, month - 1, day);
                const restrictionDateKey = formatDateKey(restrictionDate);

                // Verificar si es la fecha correcta
                if (restrictionDateKey !== dateKey) {
                    return false;
                }

                return slotTime >= startTime && slotTime <= endTime;
            }

            return true; // Tipo desconocido, permitir
        }

                if (config && config.timeRestriction && config.timeRestriction.enabled && config.timeRestriction.type === 'specific' && config.timeRestriction.date) {
                    // Parsear la fecha de la restricción
                    const [day, month, year] = config.timeRestriction.date.split('/').map(Number);
                    const restrictionDate = new Date(year, month - 1, day);
                    const restrictionDateKey = formatDateKey(restrictionDate);
                    specificDates.add(restrictionDateKey);
                }
            }

            return Array.from(specificDates);
        }

            console.log('getTurnosDisponibles - dateKey:', dateKey, 'slotId:', slotId, 'reservasPorTurno:', reservasPorTurno);
            console.log('getTurnosDisponibles - turnosData completo:', JSON.stringify(turnosData, null, 2));

            }

            const slotData = turnosData[dateKey][slotId];
            console.log('getTurnosDisponibles - slotData:', JSON.stringify(slotData, null, 2));

            // Handle both old format (with 'available') and new format (with 'used')
            if (slotData.available !== undefined && slotData.used === undefined) {
                // Old format: migrate to new format
                const used = reservasPorTurno - slotData.available;
                slotData.used = used;
                delete slotData.available;
                console.log('Migrando formato antiguo a nuevo - used:', used);
                return Math.max(0, reservasPorTurno - used);
            }

            // New format: use both available and used (like old admin panel)
            if (slotData.available !== undefined && slotData.used !== undefined) {
                // Use available directly (like old admin panel does)
                const result = Math.max(0, slotData.available);
                console.log('Slot data - available:', slotData.available, 'used:', slotData.used, 'calculated available:', result);
                return result;
            }

            // Fallback: use only used field
            const used = slotData.used || 0;
            const result = Math.max(0, reservasPorTurno - used);
            console.log('Slot data - used:', used, 'calculated available:', result);
            return result;
        }

        // Check if there are enough consecutive turnos available starting from a specific slot
        async function hasEnoughConsecutiveTurnos(dateKey, startSlotId, turnosNeeded) {
            console.log('🔍 hasEnoughConsecutiveTurnos - dateKey:', dateKey, 'startSlotId:', startSlotId, 'turnosNeeded:', turnosNeeded, 'reservasPorTurno:', reservasPorTurno);

            // If no turnos needed, always return true
            if (turnosNeeded === 0) {
                console.log('✅ No se necesitan turnos, devolviendo true');
                return true;
            }

            // Parse date correctly to avoid timezone issues
            const [year, month, day] = dateKey.split('-').map(Number);
            const date = new Date(year, month - 1, day);
            const dayOfWeek = date.getDay();
            const slots = generateTimeSlotsForDay(dayOfWeek);

            console.log('hasEnoughConsecutiveTurnos - dateKey:', dateKey, 'parsed date:', date, 'dayOfWeek:', dayOfWeek, 'slots.length:', slots.length);

            // Check if we have enough slots remaining
            if (startSlotId + turnosNeeded > slots.length) {
                console.log('❌ No hay suficientes slots restantes');
                return false;
            }

            // Check if all consecutive slots are available
            for (let i = 0; i < turnosNeeded; i++) {
                const slotId = startSlotId + i;
                const slot = slots[slotId];

                // Check if slot is in the past
                const isInPast = isTimeSlotInPast(dateKey, slot.time);
                if (isInPast) {

                    return false;
                }

                const available = await getTurnosDisponibles(dateKey, slotId);
                console.log(`hasEnoughConsecutiveTurnos - checking slot ${slotId} (${slot.time}): available=${available}, reservasPorTurno=${reservasPorTurno}`);
                if (available < 1) {
                    console.log('❌ Slot', slotId, 'no disponible (available < 1)');
                    return false;
                }
            }

            console.log('✅ Todos los slots consecutivos están disponibles');
            return true;
        }

        // Use turnos for a booking
        async function useTurnos(dateKey, startSlotId, cantidad) {
            if (!turnosData[dateKey]) {
                turnosData[dateKey] = {};
            }

            // Mark all consecutive slots as occupied
            for (let i = 0; i < cantidad; i++) {
                const slotId = startSlotId + i;

                if (!turnosData[dateKey][slotId]) {
                    turnosData[dateKey][slotId] = { available: reservasPorTurno, used: 0 };
                }

                // Increment used and decrement available (like old admin panel)
                turnosData[dateKey][slotId].used += 1;
                turnosData[dateKey][slotId].available = Math.max(0, (turnosData[dateKey][slotId].available || reservasPorTurno) - 1);
            }

            await saveTurnosData();
        }

        // Release turnos (liberar turnos cuando se cancela una reserva)
        async function liberarTurnos(dateKey, startSlotId, cantidad) {
            if (!turnosData[dateKey]) {
                turnosData[dateKey] = {};
            }

            // Release all consecutive slots
            for (let i = 0; i < cantidad; i++) {
                const slotId = startSlotId + i;

                if (!turnosData[dateKey][slotId]) {
                    turnosData[dateKey][slotId] = { available: reservasPorTurno, used: 0 };
                }

                // Decrement used and increment available (like old admin panel)
                turnosData[dateKey][slotId].used = Math.max(0, (turnosData[dateKey][slotId].used || 0) - 1);
                turnosData[dateKey][slotId].available = Math.max(0, (turnosData[dateKey][slotId].available || 0) + 1);
            }

            await saveTurnosData();
        }

        // Get total available turnos for a day
        async function getTotalTurnosDisponibles(dateKey) {
            console.log('📊 Calculando turnos disponibles para', dateKey);
            let total = 0;

            // Parse date correctly to avoid timezone issues
            const [year, month, day] = dateKey.split('-').map(Number);
            const date = new Date(year, month - 1, day);
            const dayOfWeek = date.getDay();
            const slots = generateTimeSlotsForDay(dayOfWeek);

            console.log('getTotalTurnosDisponibles - dateKey:', dateKey, 'parsed date:', date, 'dayOfWeek:', dayOfWeek, 'slots.length:', slots.length);

            for (const slot of slots) {
                // Check if slot is in the past
                const isInPast = isTimeSlotInPast(dateKey, slot.time);

                // Only count slots that are not in the past
                if (!isInPast) {
                    const available = await getTurnosDisponibles(dateKey, slot.id);
                    total += available;
                    console.log(`Slot ${slot.id} (${slot.time}): ${available} turnos disponibles`);
                } else {
                    console.log(`Slot ${slot.id} (${slot.time}): en el pasado, no se cuenta`);
                }
            }

            console.log(`Total turnos disponibles para ${dateKey}: ${total}`);
            return total;
        }

        // Get total turnos needed for selected services
        function getTotalTurnosNeeded() {
            return selectedServices.reduce((total, service) => total + service.turnos, 0);
        }

        // Get total price for selected services
        function getTotalPrice() {
            return selectedServices.reduce((total, service) => total + service.price, 0);
        }

        // Get total duration for selected services
        function getTotalDuration() {
            if (selectedServices.length === 0) return '0 minutos';

            let totalMin = 0;
            let totalMax = 0;

            selectedServices.forEach(service => {
                if (service.duration) {
                    // Parse duration format "25-35 minutos"
                    const match = service.duration.match(/(\d+)-(\d+)\s*minutos/);
                    if (match) {
                        totalMin += parseInt(match[1]);
                        totalMax += parseInt(match[2]);
                    }
                }
            });

            return `${totalMin}-${totalMax} minutos`;
        }

        // Check if a day has enough turnos for selected services
        async function hasEnoughTurnosForServices(dateKey) {
            const turnosNeeded = getTotalTurnosNeeded();

            console.log('🔍 hasEnoughTurnosForServices - dateKey:', dateKey, 'turnosNeeded:', turnosNeeded);

            // If no turnos needed, always return true
            if (turnosNeeded === 0) {
                console.log('✅ No se necesitan turnos, devolviendo true');
                return true;
            }

            // Parse date correctly to avoid timezone issues
            const [year, month, day] = dateKey.split('-').map(Number);
            const date = new Date(year, month - 1, day);
            const dayOfWeek = date.getDay();
            const slots = generateTimeSlotsForDay(dayOfWeek);

            console.log('hasEnoughTurnosForServices - dateKey:', dateKey, 'parsed date:', date, 'dayOfWeek:', dayOfWeek, 'slots.length:', slots.length);

            // Check if there are enough consecutive turnos available
            for (let i = 0; i <= slots.length - turnosNeeded; i++) {
                // Check if the starting slot is in the past
                const isInPast = isTimeSlotInPast(dateKey, slots[i].time);

                // Skip slots that are in the past
                if (isInPast) {
                    console.log(`hasEnoughTurnosForServices - slot ${i} (${slots[i].time}) is in past, skipping`);
                    continue;
                }

                const hasEnough = await hasEnoughConsecutiveTurnos(dateKey, i, turnosNeeded);
                console.log(`hasEnoughTurnosForServices - checking slot ${i} (${slots[i].time}): hasEnough=${hasEnough}`);
                if (hasEnough) {
                    console.log(`✅ Slot ${i} (${slots[i].time}) tiene suficientes turnos consecutivos`);
                    return true;
                }
            }

            console.log('❌ hasEnoughTurnosForServices - no hay suficientes turnos consecutivos');
            return false;
        }

        // Generate days for the next configured days
        async function generateDays() {
            console.log('🔄 Generando días...');
            const days = [];
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const turnosNeeded = getTotalTurnosNeeded();
            const maxDays = configTurnos.maxDiasAdelanto || 15; // Use configured days, default to 15

            // Obtener fechas específicas para los servicios seleccionados
            const specificDates = getSpecificDatesForSelectedServices();
            const hasSpecificDates = specificDates.length > 0;

            console.log('generateDays - turnosNeeded:', turnosNeeded, 'maxDays:', maxDays);
            console.log('generateDays - specificDates:', specificDates, 'hasSpecificDates:', hasSpecificDates);
            console.log('generateDays - turnosData actual:', JSON.stringify(turnosData, null, 2));

            // Si hay fechas específicas, generar días solo para esas fechas
            if (hasSpecificDates) {
                console.log('Generando días solo para fechas específicas:', specificDates);

                for (const dateKey of specificDates) {
                    const [year, month, day] = dateKey.split('-').map(Number);
                    const date = new Date(year, month - 1, day);
                    const dayOfWeek = date.getDay();

                    console.log('Procesando día específico:', dateKey, 'dayOfWeek:', dayOfWeek);

                    // Skip Sundays (0)
                    if (dayOfWeek === 0) {
                        console.log('Saltando domingo');
                        continue;
                    }

                    // Check if day is open (has business hours)
                    const hours = businessHours[dayOfWeek];
                    console.log('Horarios para día', dayOfWeek, ':', hours);
                    if (!hours) {
                        console.log('Saltando día sin horarios');
                        continue;
                    }

                    // Check if day is closed
                    if (isDayClosed(dateKey)) {
                        console.log('Saltando día cerrado:', dateKey);
                        continue;
                    }

                    // Check if there are enough turnos for selected services
                    const hasEnoughTurnos = await hasEnoughTurnosForServices(dateKey);

                    console.log('Agregando día específico:', dateKey, 'hasEnoughTurnos:', hasEnoughTurnos);

                    days.push({
                        date: date,
                        dateKey: dateKey,
                        dayName: getDayName(dayOfWeek),
                        dayNumber: date.getDate(),
                        month: date.getMonth() + 1,
                        year: date.getFullYear(),
                        hasEnoughTurnos: hasEnoughTurnos
                    });
                }
            } else {
                // Si no hay fechas específicas, generar días normalmente
                console.log('Generando días normalmente (sin restricciones de fecha específica)');

                for (let i = 0; i < maxDays; i++) {
                    const date = new Date(today);
                    date.setDate(today.getDate() + i);

                    const dayOfWeek = date.getDay();
                    const dateKey = formatDateKey(date);

                    console.log('Procesando día:', dateKey, 'dayOfWeek:', dayOfWeek);

                    // Skip Sundays (0)
                    if (dayOfWeek === 0) {
                        console.log('Saltando domingo');
                        continue;
                    }

                    // Check if day is open (has business hours)
                    const hours = businessHours[dayOfWeek];
                    console.log('Horarios para día', dayOfWeek, ':', hours);
                    if (!hours) {
                        console.log('Saltando día sin horarios');
                        continue;
                    }

                    // Check if day is closed
                    if (isDayClosed(dateKey)) {
                        console.log('Saltando día cerrado:', dateKey);
                        continue;
                    }

                    // Check if there are enough turnos for selected services
                    const hasEnoughTurnos = await hasEnoughTurnosForServices(dateKey);

                    console.log('Agregando día:', dateKey, 'hasEnoughTurnos:', hasEnoughTurnos);

                    days.push({
                        date: date,
                        dateKey: dateKey,
                        dayName: getDayName(dayOfWeek),
                        dayNumber: date.getDate(),
                        month: date.getMonth() + 1,
                        year: date.getFullYear(),
                        hasEnoughTurnos: hasEnoughTurnos
                    });
                }
            }

            console.log('Días generados:', days.length);
            return days;
        }

        // Format date as YYYY-MM-DD
        function formatDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // Get day name in Spanish
        function getDayName(dayOfWeek) {
            const days = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
            return days[dayOfWeek];
        }

        // Load horarios configuration from Firebase
        async function cargarConfigHorarios() {
            try {
                console.log('Cargando configuración de horarios de Firebase...');
                const horarios = await obtenerConfigHorariosFirebase();
                if (horarios && Object.keys(horarios).length > 0) {
                    console.log('Horarios cargados de Firebase:', horarios);

                    // Mapear nombres de días en español a números (0 = domingo, 1 = lunes, etc.)
                    const dayMapping = {
                        'domingo': 0,
                        'lunes': 1,
                        'martes': 2,
                        'miercoles': 3,
                        'jueves': 4,
                        'viernes': 5,
                        'sabado': 6
                    };

                    // Actualizar businessHours con los horarios de Firebase
                    for (const [diaNombre, config] of Object.entries(horarios)) {
                        const dayNumber = dayMapping[diaNombre.toLowerCase()];
                        if (dayNumber !== undefined) {
                            if (config.enabled && config.inicio && config.fin) {
                                businessHours[dayNumber] = {
                                    start: config.inicio,
                                    end: config.fin
                                };
                            } else {
                                businessHours[dayNumber] = null; // Día cerrado
                            }
                        }
                    }

                    console.log('businessHours actualizado:', businessHours);
                } else {
                    console.log('No hay configuración de horarios, usando valores por defecto');
                    console.log('Horarios por defecto:', businessHours);
                }
            } catch (error) {
                console.error('Error al cargar configuración de horarios:', error);
                console.log('Usando horarios por defecto debido a error:', businessHours);
            }
        }

            // Group services by subcategory
            const groupedServices = {};

                if (!groupedServices[subcategory]) {
                    groupedServices[subcategory] = [];
                }
                groupedServices[subcategory].push(service);

            let navHtml = '';

            subcategoryIds.forEach((subcategoryId, index) => {

                    // Use activeSubcategory if set, otherwise default to first one
                    const isActive = activeSubcategory === subcategoryId ? 'active' : (index === 0 && !activeSubcategory ? 'active' : '');

                    navHtml += `
                        <a href="#${sectionId}" class="service-nav-item ${isActive}" data-section="${sectionId}">

        // Setup service navigation
        function setupServiceNavigation() {
            const navItems = document.querySelectorAll('.service-nav-item');
            const navMenu = document.getElementById('serviceNavMenu');

            navItems.forEach(item => {
                item.addEventListener('click', function(e) {
                    e.preventDefault();

                    // Remove active class from all items
                    navItems.forEach(nav => nav.classList.remove('active'));

                    // Add active class to clicked item
                    this.classList.add('active');

                    // Scroll to section
                    const sectionId = this.getAttribute('data-section');
                    const section = document.getElementById(sectionId);
                    if (section) {
                        section.scrollIntoView({ behavior: 'smooth' });
                    }
                });
            });

            // Update active nav item on scroll
            window.addEventListener('scroll', updateActiveNavItem);

            // Update arrow buttons state
            navMenu.addEventListener('scroll', updateNavArrows);
            updateNavArrows();
        }

        // Scroll navigation menu
        function scrollNav(direction) {
            const navMenu = document.getElementById('serviceNavMenu');
            const scrollAmount = 200;

            if (direction === 'left') {
                navMenu.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
            } else {
                navMenu.scrollBy({ left: scrollAmount, behavior: 'smooth' });
            }
        }

        // Update navigation arrow buttons state
        function updateNavArrows() {
            const navMenu = document.getElementById('serviceNavMenu');
            const leftArrow = document.getElementById('navLeftArrow');
            const rightArrow = document.getElementById('navRightArrow');

            // Check if can scroll left
            leftArrow.disabled = navMenu.scrollLeft <= 0;

            // Check if can scroll right
            rightArrow.disabled = navMenu.scrollLeft >= navMenu.scrollWidth - navMenu.clientWidth;
        }

        // Update active navigation item on scroll
        function updateActiveNavItem() {
            const sections = document.querySelectorAll('.service-section');
            const navItems = document.querySelectorAll('.service-nav-item');

            let currentSection = '';

            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                const sectionHeight = section.clientHeight;
                if (window.scrollY >= sectionTop - 150) {
                    currentSection = section.getAttribute('id');
                }
            });

            navItems.forEach(item => {
                item.classList.remove('active');
                if (item.getAttribute('data-section') === currentSection) {
                    item.classList.add('active');
                }
            });
        }

        async function removeService(index) {
            selectedServices.splice(index, 1);
            renderCart();
            renderServices();
            await renderDays();
            updateFixedActionBar();
        }

        // Render days grid
        async function renderDays() {
            console.log('🔄 Renderizando días...');
            const grid = document.getElementById('daysGrid');
            const spinner = document.getElementById('loadingSpinner');

            // Mostrar spinner
            spinner.classList.add('show');
            grid.style.display = 'none';

            console.log('turnosData actual antes de generar días:', JSON.stringify(turnosData, null, 2));

            const days = await generateDays();

            console.log('Días generados:', days.length);

            // Obtener fechas específicas para mostrar mensaje informativo
            const specificDates = getSpecificDatesForSelectedServices();
            const hasSpecificDates = specificDates.length > 0;

            if (days.length === 0) {
                let errorMessage = 'No hay días disponibles con suficientes turnos para tus servicios seleccionados.<br><br>';
                errorMessage += `Necesitas ${getTotalTurnosNeeded()} turno(s) en total.`;

                if (hasSpecificDates) {
                    errorMessage += '<br><br><strong>⚠️ Restricciones de fecha:</strong><br>';
                    errorMessage += 'Los servicios seleccionados solo están disponibles en las siguientes fechas específicas:<br>';
                    specificDates.forEach(dateKey => {
                        const [year, month, day] = dateKey.split('-').map(Number);
                        const date = new Date(year, month - 1, day);
                        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                        errorMessage += `• ${date.toLocaleDateString('es-ES', options)}<br>`;
                    });
                }

                grid.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px;">
                        <div class="error">
                            ${errorMessage}
                        </div>
                    </div>
                `;
                // Ocultar spinner y mostrar grid
                spinner.classList.remove('show');
                grid.style.display = 'grid';
                console.log('⚠️ No hay días disponibles');
                return;
            }

            // Calculate availability for all days
            console.log('Calculando disponibilidad para', days.length, 'días...');
            const daysAvailability = await Promise.all(days.map(async day => {
                const totalDisponibles = await getTotalTurnosDisponibles(day.dateKey);
                const maxTurnos = getTotalTurnosPerDay() * reservasPorTurno;
                const percentage = (totalDisponibles / maxTurnos) * 100;

                console.log(`Día ${day.dateKey}: ${totalDisponibles}/${maxTurnos} turnos disponibles (${percentage.toFixed(1)}%)`);

                let badgeClass = 'availability-high';
                let badgeText = 'Mucha disponibilidad';

                if (percentage < 25) {
                    badgeClass = 'availability-low';
                    badgeText = 'Poca disponibilidad';
                } else if (percentage < 50) {
                    badgeClass = 'availability-medium';
                    badgeText = 'Disponibilidad media';
                }

                // Check if day has enough consecutive turnos
                const isDisabled = !day.hasEnoughTurnos;
                const clickHandler = isDisabled ? '' : `onclick="selectDate('${day.dateKey}')"`;
                const disabledClass = isDisabled ? 'disabled' : '';

                return `
                    <div class="day-card ${disabledClass}" ${clickHandler}>
                        <div class="day-date">${day.dayNumber}/${day.month}</div>
                        <div class="day-name">${day.dayName}</div>
                        <div class="day-availability">
                            <span class="availability-badge ${badgeClass}">${badgeText}</span>
                        </div>
                    </div>
                `;
            }));

            grid.innerHTML = daysAvailability.join('');

            // Ocultar spinner y mostrar grid
            spinner.classList.remove('show');
            grid.style.display = 'grid';
        }

        // Select date
        async function selectDate(dateKey) {
            selectedDate = dateKey;
            selectedTimeSlot = null;

            // Update selected state
            document.querySelectorAll('.day-card').forEach(card => {
                card.classList.remove('selected');
            });
            event.currentTarget.classList.add('selected');

            // Update progress steps
            updateProgressSteps(3);

            // Hide days grid and back button, show time slots directly
            document.getElementById('daysGrid').style.display = 'none';

            // Show time slots
            await showTimeSlots(dateKey);

            // Scroll to top of time slots section
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Check if a time slot is in the past or within minimum anticipation period
        function isTimeSlotInPast(dateKey, slotTime) {
            const now = new Date();
            const [year, month, day] = dateKey.split('-').map(Number);
            const slotDate = new Date(year, month - 1, day);

            // Parse the slot time
            const [slotHour, slotMin] = slotTime.split(':').map(Number);
            const slotDateTime = new Date(year, month - 1, day, slotHour, slotMin, 0);

            console.log('isTimeSlotInPast - dateKey:', dateKey, 'slotTime:', slotTime, 'slotDateTime:', slotDateTime, 'now:', now);
            console.log('isTimeSlotInPast - configTurnos:', configTurnos, 'anticipacionReserva:', configTurnos.anticipacionReserva);

            // Check if slot time is in the past
            if (slotDateTime < now) {
                console.log('Slot está en el pasado');
                return true;
            }

            // Check minimum anticipation period for general config
            const anticipacionGeneral = configTurnos.anticipacionReserva || 0;
            console.log('isTimeSlotInPast - anticipacionGeneral:', anticipacionGeneral);

            // Check minimum anticipation period for selected services
            let maxAnticipacionServicios = 0;
            if (selectedServices && selectedServices.length > 0) {
                for (const service of selectedServices) {
                    const config = configServicios[service.id];
                    const anticipacion = config?.anticipacion || 0;
                    if (anticipacion > maxAnticipacionServicios) {
                        maxAnticipacionServicios = anticipacion;
                    }
                }
            }
            console.log('isTimeSlotInPast - maxAnticipacionServicios:', maxAnticipacionServicios);

            // Use the maximum anticipation between general and services
            const anticipacionHoras = Math.max(anticipacionGeneral, maxAnticipacionServicios);
            console.log('isTimeSlotInPast - anticipacionHoras (max):', anticipacionHoras);

            if (anticipacionHoras > 0) {
                const minAllowedTime = new Date(now.getTime() + (anticipacionHoras * 60 * 60 * 1000));
                console.log('isTimeSlotInPast - minAllowedTime:', minAllowedTime, 'slotDateTime:', slotDateTime);

                if (slotDateTime < minAllowedTime) {
                    console.log(`Slot ${slotTime} no cumple con anticipación mínima de ${anticipacionHoras} horas`);
                    return true;
                }
            }

            console.log('Slot está disponible');
            return false;
        }

        // Render time slots (función pura - sin efectos secundarios)
        async function renderTimeSlots(dateKey) {
            console.log('🎨 Renderizando slots para', dateKey);
            console.log('🎨 renderTimeSlots - turnosData actual:', JSON.stringify(turnosData, null, 2));
            console.log('🎨 renderTimeSlots - reservasPorTurno:', reservasPorTurno);

            const container = document.getElementById('timeSlotsContainer');
            const grid = document.getElementById('timeSlotsGrid');
            const title = document.getElementById('selectedDateTitle');
            const subtitle = document.getElementById('selectedDateSubtitle');
            const spinner = document.getElementById('loadingSpinner');

            // Mostrar spinner
            spinner.classList.add('show');
            container.style.display = 'none';

            const [year, month, day] = dateKey.split('-');
            const date = new Date(year, month - 1, day);
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            title.textContent = date.toLocaleDateString('es-ES', options);

            container.classList.add('show');
            document.getElementById('bookingForm').classList.remove('show');

            console.log('turnosData actual antes de calcular disponibilidad:', JSON.stringify(turnosData, null, 2));

            const totalDisponibles = await getTotalTurnosDisponibles(dateKey);
            const turnosNeeded = getTotalTurnosNeeded();
            const maxTurnos = getTotalTurnosPerDay() * reservasPorTurno;

            // Generate time slots for this specific day
            const dayOfWeek = date.getDay();
            const slots = generateTimeSlotsForDay(dayOfWeek);

            // Calculate the last available slot based on turnos needed
            const lastAvailableSlot = slots.length - turnosNeeded;

            console.log(`📊 Resumen para ${dateKey}:`);
            console.log(`- Total disponibles: ${totalDisponibles}`);
            console.log(`- Máximo turnos: ${maxTurnos}`);
            console.log(`- Turnos necesarios: ${turnosNeeded}`);
            console.log(`- Reservas por turno: ${reservasPorTurno}`);
            console.log(`- Último slot disponible: ${lastAvailableSlot + 1}`);
            console.log(`- Total slots: ${slots.length}`);

            subtitle.textContent = `${totalDisponibles} de ${maxTurnos} turnos disponibles • ${reservasPorTurno} reserva(s) por turno • Necesitas ${turnosNeeded} turno(s) consecutivos • Último: ${lastAvailableSlot + 1}`;

            // Check availability for all slots
            console.log('🔍 Verificando disponibilidad de cada slot...');
            const slotAvailability = await Promise.all(slots.map(async slot => {
                const isAvailable = await hasEnoughConsecutiveTurnos(dateKey, slot.id, turnosNeeded);
                const isPastLastAvailable = slot.id > lastAvailableSlot;
                const isInPast = isTimeSlotInPast(dateKey, slot.time);
                const availableTurnos = await getTurnosDisponibles(dateKey, slot.id);

                console.log(`Slot ${slot.id} (${slot.time}): available=${availableTurnos}, isAvailable=${isAvailable}, isPastLastAvailable=${isPastLastAvailable}, isInPast=${isInPast}`);

                // Check if any selected service has time restriction for this slot
                let hasTimeRestriction = false;
                for (const service of selectedServices) {
                    if (!isServiceAvailableInTimeRange(service.id, dateKey, slot.time)) {
                        hasTimeRestriction = true;
                        break;
                    }
                }

                let statusText = '';
                let statusClass = '';

                if (isInPast) {
                    statusText = '⏰ Pasado';
                    statusClass = 'warning';
                } else if (hasTimeRestriction) {
                    statusText = '⏰ Restringido';
                    statusClass = 'warning';
                } else if (isPastLastAvailable) {
                    statusText = '⚠️ Insuficiente';
                    statusClass = 'warning';
                } else if (isAvailable) {
                    statusText = '✓ Disponible';
                    statusClass = 'available';
                } else {
                    statusText = '✗ Ocupado';
                    statusClass = 'occupied';
                }

                return {
                    slot,
                    isAvailable: isAvailable && !hasTimeRestriction,
                    isPastLastAvailable,
                    isInPast,
                    hasTimeRestriction,
                    statusText,
                    statusClass
                };
            }));

            grid.innerHTML = slotAvailability.map(({ slot, isAvailable, isPastLastAvailable, isInPast, hasTimeRestriction, statusText, statusClass }) => {
                return `
                    <div class="time-slot ${!isAvailable || isPastLastAvailable || isInPast ? 'disabled' : ''}" onclick="${isAvailable && !isPastLastAvailable && !isInPast ? `selectTimeSlot(${slot.id})` : ''}">
                        <div class="time-slot-time">${slot.time}</div>
                    </div>
                `;
            }).join('');

            // Ocultar spinner y mostrar contenedor
            spinner.classList.remove('show');
            container.style.display = 'block';
        }

        // Show time slots (registra listener y renderiza inicialmente)
        async function showTimeSlots(dateKey) {
            console.log('🔄 Mostrando turnos para', dateKey);
            console.log('🔄 showTimeSlots - turnosData actual:', JSON.stringify(turnosData, null, 2));
            console.log('🔄 showTimeSlots - reservasPorTurno:', reservasPorTurno);

            // Limpiar listener anterior si existe
            if (reservasFechaUnsubscribe) {
                reservasFechaUnsubscribe();
                reservasFechaUnsubscribe = null;
            }

            // Escuchar reservas en tiempo real para esta fecha
            // Si alguien más reserva, actualiza automáticamente los slots disponibles
            reservasFechaUnsubscribe = escucharReservasPorFechaFirebase(dateKey, async (reservas) => {
                console.log('📡 Actualización de reservas para fecha:', dateKey, 'Total:', reservas.length);

                // Recalcular turnosData para esta fecha desde las reservas reales
                const reservasPorTurnoActual = reservasPorTurno;
                if (!turnosData[dateKey]) turnosData[dateKey] = {};

                // Resetear slots de este día
                const slotsDelDia = {};
                reservas.forEach(r => {
                    const timeSlot = r.timeSlot || 0;
                    const totalTurnos = r.totalTurnos || 1;
                    for (let i = 0; i < totalTurnos; i++) {
                        const slotId = timeSlot + i;
                        if (!slotsDelDia[slotId]) {
                            slotsDelDia[slotId] = { available: reservasPorTurnoActual, used: 0 };
                        }
                        slotsDelDia[slotId].used++;
                        slotsDelDia[slotId].available = Math.max(0, reservasPorTurnoActual - slotsDelDia[slotId].used);
                    }
                });

                turnosData[dateKey] = slotsDelDia;

                // Rerenderizar solo si el usuario sigue viendo esa fecha (usando función pura de render)
                if (selectedDate === dateKey) {
                    console.log('🔄 Recargando slots debido a cambio en reservas');
                    await renderTimeSlots(dateKey);
                }
            });

            // Renderizar inicialmente usando la función pura
            await renderTimeSlots(dateKey);
        }

        // Select time slot
        function selectTimeSlot(slotId) {
            selectedTimeSlot = slotId;

            const turnosNeeded = getTotalTurnosNeeded();
            const occupiedSlots = getOccupiedSlotRange(slotId, turnosNeeded);

            // Update selected state - mark all occupied slots
            document.querySelectorAll('.time-slot').forEach((slotElement, index) => {
                slotElement.classList.remove('selected');

                // Mark all slots that will be occupied by this booking
                if (occupiedSlots.includes(index)) {
                    slotElement.classList.add('selected');
                }
            });

            // Update progress steps
            updateProgressSteps(4);

            // Show booking form
            showBookingForm();
        }

        // Show booking form
        function showBookingForm() {
            const form = document.getElementById('bookingForm');
            const [year, month, day] = selectedDate.split('-');
            const date = new Date(year, month - 1, day);
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };

            // Get the specific slot for this day
            const dayOfWeek = date.getDay();
            const slots = generateTimeSlotsForDay(dayOfWeek);
            const slot = slots.find(s => s.id === selectedTimeSlot);

            // Get the range of occupied slots
            const turnosNeeded = getTotalTurnosNeeded();
            const occupiedSlots = getOccupiedSlotRange(selectedTimeSlot, turnosNeeded);
            const firstSlot = slots.find(s => s.id === occupiedSlots[0]);
            const lastSlot = slots.find(s => s.id === occupiedSlots[occupiedSlots.length - 1]);

            // Render services summary
            const servicesSummary = document.getElementById('servicesSummary');
            servicesSummary.innerHTML = selectedServices.map(service => `
                <div class="summary-item">
                    <div>
                        <span>${service.name}</span>
                        <div style="font-size: 12px; color: var(--text-secondary); margin-top: 2px;">${service.duration}</div>
                    </div>
                    <span>$U ${service.price.toLocaleString()}</span>
                </div>
            `).join('');

            document.getElementById('summaryDate').textContent = date.toLocaleDateString('es-ES', options);
            document.getElementById('summaryTime').textContent = `Llegada: ${slot.arrivalTime} (${slot.time})`;
            document.getElementById('summaryTotal').textContent = `$U ${getTotalPrice().toLocaleString()}`;

            // Update turnos info with occupied range
            const turnosInfo = document.getElementById('turnosInfo');
            const totalDuration = getTotalDuration();
            turnosInfo.innerHTML = `
                <strong>✓ Horario</strong><br>
                Llegada: ${slot.arrivalTime}<br>
                Duración: ${totalDuration}
            `;
            turnosInfo.style.background = '#e8f5e9';
            turnosInfo.style.color = '#2e7d32';

            form.classList.add('show');

            // Scroll to form (but not to top, as this is the final confirmation step)
            form.scrollIntoView({ behavior: 'smooth' });
        }

        // Update progress steps
        function updateProgressSteps(currentStep) {
            for (let i = 0; i <= 4; i++) {
                const step = document.getElementById(`step${i}`);
                step.classList.remove('active', 'completed');

                if (i < currentStep) {
                    step.classList.add('completed');
                } else if (i === currentStep) {
                    step.classList.add('active');
                }
            }
        }

        // Handle form submission
        document.getElementById('reservationForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // Validate phone number
            const phone = document.getElementById('phone').value;
            const cleanPhone = phone.replace(/\s/g, ''); // Eliminar espacios

            if (cleanPhone.length !== 9 || !/^\d+$/.test(cleanPhone)) {
                alert('El teléfono debe tener 9 dígitos numéricos.');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Confirmar';
                return;
            }

            // Validar anticipación de servicios
            const anticipacionValidation = validarAnticipacionServicios();
            if (!anticipacionValidation.valid) {
                alert(anticipacionValidation.message);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Confirmar';
                return;
            }

            document.getElementById('timeSlotsContainer').style.display = 'none';
            document.getElementById('bookingForm').style.display = 'none';
            document.getElementById('loadingSpinner').classList.add('show');

            // Get the specific slot for arrival time
            const [year, month, day] = selectedDate.split('-').map(Number);
            const date = new Date(year, month - 1, day);
            const dayOfWeek = date.getDay();
            const slots = generateTimeSlotsForDay(dayOfWeek);
            const slot = slots.find(s => s.id === selectedTimeSlot);

            const formData = {
                date: selectedDate,
                timeSlot: selectedTimeSlot,
                arrivalTime: slot ? slot.arrivalTime : null, // Agregar hora de llegada
                name: document.getElementById('name').value,
                phone: cleanPhone, // Usar el teléfono limpio
                email: '', // Campo email eliminado del formulario
                services: selectedServices.map(s => ({
                    id: s.id,
                    name: s.name,
                    price: s.price,
                    turnos: s.turnos
                })),
                totalTurnos: getTotalTurnosNeeded(),
                totalPrice: getTotalPrice(),
                notes: document.getElementById('notes').value,
                timestamp: new Date().toISOString()
            };

            try {
                console.log('Iniciando proceso de reserva...');
                console.log('selectedDate:', selectedDate);
                console.log('selectedTimeSlot:', selectedTimeSlot);
                console.log('selectedServices:', selectedServices);

                // Validar que todos los datos necesarios estén presentes
                if (!selectedDate || selectedTimeSlot === null || selectedServices.length === 0) {
                    throw new Error('Faltan datos necesarios para la reserva');
                }

                // Save booking to Firebase (la transacción ya maneja la actualización de turnosData)
                console.log('Guardando en Firebase...');
                try {
                    const reservaId = await guardarReservaFirebase(formData);
                    console.log('Reserva guardada en Firebase con ID:', reservaId);
                } catch (firebaseError) {
                    console.error('Error al guardar en Firebase:', firebaseError);
                    throw firebaseError;
                }

                // Generate services list for message
                const servicesList = selectedServices.map(s => `• ${s.name} (${s.duration}) - $U ${s.price.toLocaleString()}`).join('\n');

                // Get the specific slot for arrival time
                const [year, month, day] = selectedDate.split('-').map(Number);
                const date = new Date(year, month - 1, day);
                const dayOfWeek = date.getDay();
                const slots = generateTimeSlotsForDay(dayOfWeek);
                const slot = slots.find(s => s.id === selectedTimeSlot);

                // Get the range of occupied slots
                const turnosNeeded = getTotalTurnosNeeded();
                const occupiedSlots = getOccupiedSlotRange(selectedTimeSlot, turnosNeeded);
                const firstSlot = slots.find(s => s.id === occupiedSlots[0]);
                const lastSlot = slots.find(s => s.id === occupiedSlots[occupiedSlots.length - 1]);

                // Hide loading spinner
                document.getElementById('loadingSpinner').classList.remove('show');

                // Show success message
                alert('¡Reserva confirmada!\n\n' +
                      '📅 Fecha: ' + selectedDate + '\n' +
                      '⏰ Hora de llegada: ' + slot.arrivalTime + '\n' +
                      '⏱️ Turnos: ' + occupiedSlots.map(id => id + 1).join(', ') + '\n' +
                      '📅 Horario: ' + firstSlot.arrivalTime + ' - ' + lastSlot.time.split(' - ')[1] + '\n' +
                      '💇 Servicios:\n' + servicesList + '\n' +
                      '💰 Total: $U ' + getTotalPrice().toLocaleString() + '\n' +
                      '🎫 Turnos: ' + getTotalTurnosNeeded() + '\n\n' +
                      'Te recomendamos llegar 10 minutos antes.');

                // Reset form and redirect to course section
                this.reset();
                window.location.href = 'index.html?openCatalog=true';

            } catch (error) {
                console.error('Error detallado:', error);
                document.getElementById('loadingSpinner').classList.remove('show');
                document.getElementById('timeSlotsContainer').style.display = '';
                document.getElementById('bookingForm').style.display = '';
                alert('Hubo un error al procesar tu reserva: ' + error.message + '\n\nPor favor intenta nuevamente.');
            }
        });
    </script>
